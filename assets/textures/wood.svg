<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Wood grain texture for the board frame</title>
  <defs>
    <!-- Long, stretched noise reads as grain running along the timber. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.9" numOctaves="5" seed="23"
                    stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
                     values="0 0 0 0 0.26
                             0 0 0 0 0.15
                             0 0 0 0 0.06
                             0.55 0 0 0 0"/>
    </filter>

    <!-- Occasional darker streaks, like heartwood. -->
    <filter id="streaks" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.42" numOctaves="2" seed="5"
                    stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
                     values="0 0 0 0 0.18
                             0 0 0 0 0.10
                             0 0 0 0 0.04
                             0.4 0 0 0 0"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="#8b5a2b"/>
  <rect width="256" height="256" filter="url(#streaks)" opacity="0.7"/>
  <rect width="256" height="256" filter="url(#grain)" opacity="0.8"/>
</svg>
