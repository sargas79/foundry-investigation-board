<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Paper fibre texture</title>
  <defs>
    <!-- Fine fibres, stretched slightly along the grain direction. -->
    <filter id="fibres" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 1.6" numOctaves="4" seed="3"
                    stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
                     values="0 0 0 0 0.45
                             0 0 0 0 0.40
                             0 0 0 0 0.31
                             0.16 0 0 0 0"/>
    </filter>

    <!-- Broad, soft mottling so large sheets don't look flat. -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11"
                    stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
                     values="0 0 0 0 0.36
                             0 0 0 0 0.29
                             0 0 0 0 0.18
                             0.10 0 0 0 0"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="#f3ece0"/>
  <rect width="256" height="256" filter="url(#mottle)"/>
  <rect width="256" height="256" filter="url(#fibres)"/>
</svg>
